version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: medisync_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medisync_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medisync_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-medisync_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medisync_user} -d ${POSTGRES_DB:-medisync_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: medisync_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-medisync_user}:${POSTGRES_PASSWORD:-medisync_secret_password}@db:5432/${POSTGRES_DB:-medisync_db}
      SECRET_KEY: ${SECRET_KEY:-medisync_super_secret_production_key_3892}
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  postgres_data:
